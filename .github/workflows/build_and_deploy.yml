name: KatharScan Android Build

# MANUAL ONLY — Section 5's MANDATORY rule.
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on stub code
        working-directory: app
        run: grep -r "throw UnimplementedError" lib/ && exit 1 || exit 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter packages
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      # ✅ GENERATE ICON + SPLASH (Both)
      - name: Generate app icon and splash
        working-directory: app
        run: |
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: L10n audit (drift guard)
        working-directory: app
        run: python3 tool/l10n_audit.py

      - name: Static analysis
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyzer-log.txt

      - name: Upload analyzer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-error-log
          path: app/analyzer-log.txt

      # 🔐 MASTER KEYSTORE DECODE & SIGNING SETUP
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks
          fi

      - name: Create key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f app/android/app/upload-keystore.jks ]; then
            echo "storeFile=upload-keystore.jks" > app/android/key.properties
            echo "keyAlias=$ANDROID_KEY_ALIAS" >> app/android/key.properties
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> app/android/key.properties
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> app/android/key.properties
          fi

      - name: Build AAB (Play Store)
        working-directory: app
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=symbols

      - name: Build APK (direct sideload testing)
        working-directory: app
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=symbols

      - uses: actions/upload-artifact@v4
        with:
          name: katharscan-android-aab
          path: app/build/app/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: katharscan-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: katharscan-android-debug-symbols
          path: app/symbols/

      # 🧹 CLEANUP SENSITIVE FILES
      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f app/android/app/upload-keystore.jks
          rm -f app/android/key.properties

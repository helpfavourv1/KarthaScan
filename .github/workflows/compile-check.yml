name: KatharScan Compile Check

# MANUAL ONLY. Compiles and tests the code; the only APK it ever makes is a
# throwaway debug build that is never uploaded. The existing build_and_deploy.yml is untouched.
#
# Job 1 (dart-check): pub get, gen-l10n, l10n audit, stub check,
#   flutter analyze (the lint step), flutter test.
# Job 2 (kotlin-check): compiles the Android Kotlin sources only
#   (:app:compileDebugKotlin). No package/assemble task is run.
#
# Job 3 (android-debug-build): a full DEBUG build of the Android app
#   (flutter build apk --debug) to prove native plugins and Gradle packaging
#   work. The APK is thrown away: nothing is uploaded or signed.
#
# Job 4 (android-emulator-tests): boots an Android emulator and runs
#   app/integration_test (real OCR, downloads, PDF/export, tray walk). Nothing is
#   signed or uploaded; results are written as annotations.
#
# Job 5 (ios-simulator-check): builds the iOS app for the simulator (no signing) and runs
#   integration_test/ios_ocr_test.dart on an iPhone simulator. Nothing is signed or uploaded.
#
# Failures are also written as GitHub annotations (file, line, message)
# so they can be read from the run's check annotations without
# downloading logs. No secrets, keystore or artifact upload are used.
on:
  workflow_dispatch:
    inputs:
      emu_filter:
        description: 'Emulator stress tests only: run just tests whose name contains this text (a regex such as "S4|S5|S6", or the word monkey for the random-tap run; empty = everything)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  dart-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare log folder
        run: mkdir -p /tmp/cc

      - name: Get Flutter packages
        id: pub
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/cc/pub.log

      - name: Generate localizations
        id: l10n
        working-directory: app
        run: |
          set -o pipefail
          flutter gen-l10n 2>&1 | tee /tmp/cc/l10n.log

      - name: L10n audit (drift guard)
        id: audit
        working-directory: app
        run: |
          set -o pipefail
          python3 tool/l10n_audit.py 2>&1 | tee /tmp/cc/audit.log

      - name: Fail on stub code
        id: stub
        working-directory: app
        run: |
          set -o pipefail
          { grep -rn "throw UnimplementedError" lib/ && echo "Stub code found" && exit 1 || exit 0; } 2>&1 | tee /tmp/cc/stub.log

      - name: Static analysis (lint)
        id: analyze
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/cc/analyze.log

      - name: Unit tests
        id: test
        working-directory: app
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/cc/test.log

      - name: Report problems as annotations
        if: always()
        env:
          OUT_PUB: ${{ steps.pub.outcome }}
          OUT_L10N: ${{ steps.l10n.outcome }}
          OUT_AUDIT: ${{ steps.audit.outcome }}
          OUT_STUB: ${{ steps.stub.outcome }}
          OUT_ANALYZE: ${{ steps.analyze.outcome }}
          OUT_TEST: ${{ steps.test.outcome }}
        run: |
          python3 - <<'PY'
          import os, re

          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          def read(name):
              try:
                  return open('/tmp/cc/' + name, encoding='utf-8', errors='replace').read()
              except OSError:
                  return ''

          def tail(text, lines=40, limit=3500):
              t = '\n'.join(text.strip().splitlines()[-lines:])
              return t[-limit:]

          analyze = read('analyze.log')
          pat = re.compile(r'^\s*(error|warning|info)\s+•\s+(.*?)\s+•\s+(\S+?):(\d+):(\d+)\s+•\s+(\S+)\s*$', re.M)
          found = pat.findall(analyze)
          rank = {'error': 0, 'warning': 1, 'info': 2}
          found.sort(key=lambda x: rank[x[0]])
          for sev, msg, path, line, col, code in found[:9]:
              level = 'error' if sev == 'error' else 'warning'
              print('::%s file=app/%s,line=%s,col=%s,title=%s %s::%s' % (level, path, line, col, sev, code, esc(msg)))
          if os.environ.get('OUT_ANALYZE') == 'failure':
              counts = {k: sum(1 for f in found if f[0] == k) for k in rank}
              print('::error title=analyze summary::%s' % esc('errors=%d warnings=%d infos=%d\n%s' % (counts['error'], counts['warning'], counts['info'], tail(analyze, 25, 1500))))

          for key, name, label in [
              ('OUT_PUB', 'pub.log', 'flutter pub get'),
              ('OUT_L10N', 'l10n.log', 'flutter gen-l10n'),
              ('OUT_AUDIT', 'audit.log', 'l10n audit'),
              ('OUT_STUB', 'stub.log', 'stub check'),
              ('OUT_TEST', 'test.log', 'flutter test'),
          ]:
              if os.environ.get(key) == 'failure':
                  text = read(name)
                  if name == 'test.log':
                      rows = text.splitlines()
                      starts = [i for i, l in enumerate(rows) if '[E]' in l]
                      names = []
                      for l in rows:
                          if '[E]' in l:
                              n = l.split(': ', 1)[-1].replace('[E]', '').strip()
                              if n not in names:
                                  names.append(n)
                      print('::error title=failing tests::%s' % esc('\n'.join(names[:12])[:3000]))
                      seen = set()
                      for i in starts:
                          n = rows[i].split(': ', 1)[-1].replace('[E]', '').strip()
                          if n in seen or len(seen) >= 12:
                              continue
                          seen.add(n)
                          msg = []
                          for l in rows[i + 1:i + 14]:
                              if l.strip().startswith('package:') or l.startswith('00:'):
                                  break
                              msg.append(l)
                          print('::error title=failure detail::%s' % esc((n + '\n' + '\n'.join(msg))[:1500]))
                      chunks = ['\n'.join(rows[max(0, i - 30):i + 8]) for i in starts[:1]]
                      text = '\n=====\n'.join(chunks) if chunks else tail(text, 40, 3000)
                  print('::error title=%s failed::%s' % (label, esc(tail(text, 80, 3800))))
          PY

  kotlin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare log folder
        run: mkdir -p /tmp/cc

      - name: Get Flutter packages
        id: pub
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/cc/pub.log

      - name: Add Gradle wrapper files (CI only, not committed)
        id: wrapper
        working-directory: app
        run: |
          set -o pipefail
          flutter create --platforms=android --project-name katharscan --org com.zdmgold . 2>&1 | tee /tmp/cc/wrapper.log
          ls -la android | tee -a /tmp/cc/wrapper.log

      - name: Compile Kotlin (no APK)
        id: kotlin
        working-directory: app/android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain 2>&1 | tee /tmp/cc/kotlin.log

      - name: Report problems as annotations
        if: always()
        env:
          OUT_PUB: ${{ steps.pub.outcome }}
          OUT_WRAPPER: ${{ steps.wrapper.outcome }}
          OUT_KOTLIN: ${{ steps.kotlin.outcome }}
        run: |
          python3 - <<'PY'
          import os, re

          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          def read(name):
              try:
                  return open('/tmp/cc/' + name, encoding='utf-8', errors='replace').read()
              except OSError:
                  return ''

          def tail(text, lines=40, limit=3500):
              t = '\n'.join(text.strip().splitlines()[-lines:])
              return t[-limit:]

          kotlin = read('kotlin.log')
          pat = re.compile(r'^e: (?:file://)?(\S+?\.kt):(\d+):(\d+)\s+(.*)$', re.M)
          for path, line, col, msg in pat.findall(kotlin)[:9]:
              rel = path.split('/app/android/', 1)[-1]
              print('::error file=app/android/%s,line=%s,col=%s,title=kotlin::%s' % (rel, line, col, esc(msg)))

          for key, name, label in [
              ('OUT_PUB', 'pub.log', 'flutter pub get'),
              ('OUT_WRAPPER', 'wrapper.log', 'gradle wrapper setup'),
              ('OUT_KOTLIN', 'kotlin.log', 'kotlin compile'),
          ]:
              if os.environ.get(key) == 'failure':
                  text = read(name)
                  if name == 'kotlin.log':
                      keep = [l for l in text.splitlines() if l.startswith('e: ') or 'What went wrong' in l or 'FAILED' in l or 'Could not' in l or 'error:' in l.lower()]
                      text = '\n'.join(keep[:30]) + '\n--- tail ---\n' + tail(text, 25, 1800)
                  print('::error title=%s failed::%s' % (label, esc(tail(text, 60, 3500))))
          PY

  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare log folder
        run: mkdir -p /tmp/cc

      - name: Get Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Generate localizations
        working-directory: app
        run: flutter gen-l10n

      - name: Build debug APK (thrown away)
        id: build
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/cc/build.log

      - name: Report problems as annotations
        if: always() && steps.build.outcome == 'failure'
        run: |
          python3 - <<'PY'
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          text = open('/tmp/cc/build.log', encoding='utf-8', errors='replace').read()
          keep = [l for l in text.splitlines() if l.startswith('e: ') or 'What went wrong' in l or 'FAILED' in l or 'Could not' in l or 'error:' in l.lower() or 'Execution failed' in l]
          out = '\n'.join(keep[:30]) + '\n--- tail ---\n' + '\n'.join(text.strip().splitlines()[-30:])
          print('::error title=debug APK build failed::%s' % esc(out[-3500:]))
          PY

  android-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare log folder
        run: mkdir -p /tmp/cc

      - name: Get packages, localizations and Gradle wrapper
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter create --platforms=android --project-name katharscan --org com.zdmgold .

      - name: Run emulator tests
        id: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: |
            bash -c 'F="${{ github.event.inputs.emu_filter }}"; MONKEY() { adb logcat -c; adb install -r -g build/app/outputs/flutter-apk/app-debug.apk >/dev/null 2>&1; adb shell am start -n com.zdmgold.katharscan/.MainActivity >/dev/null 2>&1; sleep 25; timeout 420 adb shell monkey -p com.zdmgold.katharscan --throttle 60 --pct-syskeys 0 --pct-appswitch 0 -s 42 -v 6000 > /tmp/cc/monkey.log 2>&1; adb logcat -d -b crash > /tmp/cc/crash.log 2>&1; adb logcat -d | grep -i -A12 "ANR in" | head -40 >> /tmp/cc/crash.log; }; touch /tmp/cc/emu.log /tmp/cc/emu2.log; if [ "$F" = monkey ]; then flutter build apk --debug --no-pub >/dev/null 2>&1; MONKEY; exit 0; fi; if [ -n "$F" ]; then timeout 1700 flutter test integration_test/emulator_stress_test.dart --no-pub -d emulator-5554 --name "$F" --reporter expanded 2>&1 | tee /tmp/cc/emu2.log; exit 0; fi; flutter test integration_test/emulator_suite_test.dart --no-pub -d emulator-5554 --reporter expanded 2>&1 | tee /tmp/cc/emu.log; timeout 1700 flutter test integration_test/emulator_stress_test.dart --no-pub -d emulator-5554 --reporter expanded 2>&1 | tee /tmp/cc/emu2.log; MONKEY; true'

      - name: Report results as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import re
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          try:
              text = open('/tmp/cc/emu.log', encoding='utf-8', errors='replace').read()
              try:
                  text += '\n' + open('/tmp/cc/emu2.log', encoding='utf-8', errors='replace').read()
              except OSError:
                  pass
          except OSError:
              text = ''
          rows = [l.split('EMU: ', 1)[1].strip() for l in text.splitlines() if 'EMU: ' in l]
          seen = []
          for r in rows:
              if r not in seen:
                  seen.append(r)
          fails = [r for r in seen if '| FAIL |' in r]
          rest = [r for r in seen if '| FAIL |' not in r]
          allrows = [r for r in fails if not r.startswith('S1-problem')] + [r for r in rest if not r.startswith('S6-tap')]
          chunk, n = '', 1
          for r in allrows:
              if len(chunk) + len(r) > 3000:
                  print('::notice title=emulator results part %d::%s' % (n, esc(chunk)))
                  chunk, n = '', n + 1
              chunk += r[:700] + '\n'
          if chunk:
              print('::notice title=emulator results part %d::%s' % (n, esc(chunk)))
          for r in sorted(fails, key=lambda r: r.startswith('S1-problem'))[:15]:
              print('::error title=emulator FAIL::%s' % esc(r[:1500]))
          if not seen:
              keep = [l for l in text.splitlines() if 'Error' in l or 'error' in l or 'FAILED' in l or 'Exception' in l]
              print('::error title=emulator run produced no results::%s' % esc(('\n'.join(keep[:25]) + '\n--- tail ---\n' + '\n'.join(text.strip().splitlines()[-25:]))[-3500:]))
          else:
              errs = [l for l in text.splitlines() if '[E]' in l or 'Some tests failed' in l]
              if errs:
                  print('::error title=emulator test errors::%s' % esc('\n'.join(errs[:20])[:3000]))
              rows2 = text.splitlines()
              for i, l in enumerate(rows2):
                  if '[E]' in l and 'C1' in l:
                      print('::error title=emulator test detail::%s' % esc('\n'.join(rows2[max(0, i - 40):i + 3])[-3000:]))
                      break

          PY
          python3 - <<'PY'
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          def rd(n):
              try:
                  return open('/tmp/cc/' + n, encoding='utf-8', errors='replace').read()
              except OSError:
                  return ''
          m = rd('monkey.log')
          c = rd('crash.log')
          crashed = 'CRASH' in m or 'ANR' in m or 'FATAL EXCEPTION' in c
          events = [l for l in m.splitlines() if 'Events injected' in l]
          print('::%s title=monkey (6000 random events)::%s' % ('error' if crashed else 'notice', esc((' '.join(events) + '\n' + ('\n'.join([l for l in (m + c).splitlines() if 'CRASH' in l or 'ANR' in l or 'Exception' in l or 'FATAL' in l][:20]) if crashed else 'no crash, no ANR'))[:3000])))
          PY
          grep -q "Some tests failed" /tmp/cc/emu.log /tmp/cc/emu2.log && exit 1 || exit 0

  ios-simulator-check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare log folder
        run: mkdir -p /tmp/cc

      - name: Get packages and localizations
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b | tail -1
          xcrun simctl list runtimes | tail -3

      - name: Build and run iOS tests
        id: ios
        working-directory: app
        run: |
          set +e
          flutter test integration_test/ios_ocr_test.dart -d "${{ steps.sim.outputs.udid }}" --reporter expanded 2>&1 | tee /tmp/cc/ios.log
          exit 0

      - name: Report results as annotations
        if: always()
        run: |
          python3 - <<'PY'
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          try:
              text = open('/tmp/cc/ios.log', encoding='utf-8', errors='replace').read()
          except OSError:
              text = ''
          rows = []
          for l in text.splitlines():
              if 'EMU: ' in l:
                  r = l.split('EMU: ', 1)[1].strip()
                  if r not in rows:
                      rows.append(r)
          bad = [r for r in rows if '| FAIL |' in r]
          if rows:
              print('::notice title=iOS Vision OCR::%s' % esc('\n'.join(rows)[:3500]))
          for r in bad:
              print('::error title=iOS FAIL::%s' % esc(r[:1200]))
          if not rows:
              keep = [l for l in text.splitlines() if 'error' in l.lower() or 'Error' in l or 'failed' in l.lower()]
              print('::error title=iOS run produced no results::%s' % esc(('\n'.join(keep[:25]) + '\n--- tail ---\n' + '\n'.join(text.strip().splitlines()[-25:]))[-3500:]))
          PY

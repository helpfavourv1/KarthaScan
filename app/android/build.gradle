buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Subproject hook for plugin compatibility with Flutter 3.24
subprojects {
    plugins.withId("com.android.library") {
        if (!project.android.hasProperty("flutter")) {
            project.android.ext.flutter = [:]
        }
        // Inject directly into the flutter map so plugins don't pull null
        project.android.ext.flutter.compileSdkVersion = 35
        project.android.ext.flutter.ndkVersion = "27.0.12077973"
        
        // Fallback for direct Android assignment
        project.android.compileSdkVersion = 35
        project.android.ndkVersion = "27.0.12077973"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

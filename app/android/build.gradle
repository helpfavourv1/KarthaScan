buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Subproject hook for plugin compatibility
subprojects {
    plugins.withId("com.android.library") {
        if (!project.android.hasProperty("flutter")) {
            project.android.ext.flutter = [:]
        }
        
        // Base injections
        project.android.ext.flutter.compileSdkVersion = 36
        project.android.ext.flutter.ndkVersion = "27.0.12077973"
        project.android.compileSdkVersion = 36
        project.android.ndkVersion = "27.0.12077973"

        // The AGP Variant API Override
        // This safely overwrites hardcoded SDK limits from old plugins without triggering the "too late" crash.
        project.androidComponents {
            finalizeDsl { ext ->
                ext.compileSdk = 36
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

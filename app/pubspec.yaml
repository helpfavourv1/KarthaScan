name: katharscan
description: Document scanner with on-device text recognition, editing and export to PDF, Word, text and images.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & DI
  provider: ^6.1.2

  # Monetization & Ads
  in_app_purchase: ^3.2.1
  in_app_review: ^2.0.12
  # Pinned to the upstream commit that fixes the iOS build error (PR 1516,
  # 'Fixed Beta headers'); published 9.1.0 does not compile for iOS. Switch back
  # to a normal version once google_mobile_ads 9.2.0 is on pub.dev.
  google_mobile_ads:
    git:
      url: https://github.com/googleads/googleads-mobile-flutter
      ref: c9a915b8f2cdd673b108bc88a4be55251da1bb63
      path: packages/google_mobile_ads

  # Storage & Security
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  file_saver: ^0.2.9
  path: ^1.9.0
  shared_preferences: ^2.3.3
  encrypt: ^5.0.3
  crypto: ^3.0.6
  file_picker: ^8.1.4

  # Document & Processing
  flutter_doc_scanner: ^0.0.21
  pdf_render_plus: ^1.4.16
  google_mlkit_text_recognition: ^0.15.0
  share_plus: ^12.0.0
  cross_file: ^0.3.4+2
  pdf: ^3.11.1
  archive: ^3.6.1
  image: ^4.3.0
  printing: ^5.13.4

  # Permissions & Utilities
  permission_handler: ^11.3.1
  intl: ^0.20.3
  go_router: ^14.6.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_local_notifications: ^17.2.3
  flutter_timezone: ^4.1.1
  timezone: ^0.9.3
  package_info_plus: ^8.0.0

  # Native App Polish & Icons
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.2
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/onboarding/
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/licenses/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf

name: katharscan
description: >
  Scan documents with free unlimited OCR, no watermarks, no account
  required, and no ads.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & DI
  provider: ^6.1.2

  # Monetization & Ads
  in_app_purchase: ^3.2.1
  google_mobile_ads: ^9.1.0

  # Storage & Security
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  encrypt: ^5.0.3
  crypto: ^3.0.6
  file_picker: ^8.1.4

  # Document & Processing
  flutter_doc_scanner: ^0.0.21
  google_mlkit_text_recognition: ^0.15.0
  share_plus: ^12.0.0
  cross_file: ^0.3.4+2
  pdf: ^3.11.1
  archive: ^3.6.1
  image: ^4.3.0

  # Permissions & Utilities
  permission_handler: ^11.3.1
  intl: ^0.20.3
  go_router: ^14.6.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

  # Native App Polish & Icons
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.2
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.svg

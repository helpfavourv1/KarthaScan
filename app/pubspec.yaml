name: katharscan
description: >
  Scan documents with free unlimited OCR, no watermarks, no account
  required, and no ads.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Scanning & OCR ---
  flutter_doc_scanner: ^0.0.21
  google_mlkit_text_recognition: ^0.15.0

  # --- Storage ---
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # --- Sharing & export ---
  share_plus: ^12.0.0
  cross_file: ^0.3.4+2
  pdf: ^3.11.1
  archive: ^3.6.1
  image: ^4.3.0

  # --- Permissions ---
  permission_handler: ^11.3.1

  # --- Monetization ---
  in_app_purchase: ^3.2.1

  # --- Locale ---
  intl: ^0.19.0

  # --- State management / DI ---
  provider: ^6.1.2

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Native app polish ---
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.2

  # --- Security ---
  encrypt: ^5.0.3
  crypto: ^3.0.6
  file_picker: ^8.1.4

  # --- Opening external links ---
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.svg

# flutter_launcher_icons.yaml
# Android-only launcher icon generation.

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false  # Disable iOS since no iOS project assets exist
  image_path: "assets/icon_source.png"
  min_sdk_android: 21

  adaptive_icon_background: "#007AFF"
  adaptive_icon_foreground: "assets/icon_source.png"

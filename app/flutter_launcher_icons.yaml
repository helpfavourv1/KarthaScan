# flutter_launcher_icons.yaml
# iOS-grade launcher icon using new brand colors.

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon_source.png"
  min_sdk_android: 21

  # Android adaptive icon (API 26+)
  adaptive_icon_background: "#007AFF"
  adaptive_icon_foreground: "assets/icon_source.png"

  remove_alpha_ios: true

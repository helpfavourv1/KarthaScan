      <stop offset="1" stop-color="#0051D5"/>
    </linearGradient>
    <linearGradient id="ink" x1="300" y1="380" x2="724" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0040C8"/>
    </linearGradient>
  </defs>

  <!-- White full field -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- THIN meandering line around the outer boundary -->
  <path d="M96 200 C 200 140 320 180 512 150 C 704 120 824 140 928 200 C 968 320 940 420 952 512 C 964 604 968 704 928 824 C 824 884 704 864 512 894 C 320 924 200 884 96 824 C 56 704 84 604 72 512 C 60 420 56 320 96 200 Z"
        stroke="#000000" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- ENLARGED thick blue meandering ribbon -->
  <path d="M136 350 C 250 180 400 320 512 240 C 624 160 774 180 888 350 C 916 460 916 564 888 674 C 774 844 624 704 512 784 C 400 864 250 844 136 674 C 108 564 108 460 136 350 Z" fill="url(#blue)"/>

  <!-- ENLARGED scanner body -->
  <rect x="272" y="300" width="480" height="424" rx="36" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="6"/>
  <!-- Glass -->
  <rect x="296" y="340" width="432" height="296" rx="16" fill="#F2F2F7" stroke="#D1D1D6" stroke-width="4"/>
  <!-- Control panel + buttons -->

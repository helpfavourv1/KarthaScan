  <circle cx="344" cy="674" r="9" fill="#007AFF"/>
  <circle cx="388" cy="674" r="9" fill="#34C759"/>
  <circle cx="432" cy="674" r="9" fill="#FF9500"/>

  <!-- GIANT bold script -->
  <text x="512" y="492" font-family="'Snell Roundhand', 'Brush Script MT', 'Apple Chancery', 'Segoe Script', cursive" font-size="170" font-weight="900" fill="url(#ink)" stroke="url(#ink)" stroke-width="9" stroke-linejoin="round" text-anchor="middle">Sign</text>
  <text x="512" y="616" font-family="'Snell Roundhand', 'Brush Script MT', 'Apple Chancery', 'Segoe Script', cursive" font-size="120" font-weight="900" fill="url(#ink)" stroke="url(#ink)" stroke-width="7" stroke-linejoin="round" text-anchor="middle" letter-spacing="2">+ OCR</text>
</svg>

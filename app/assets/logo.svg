<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blue" x1="188" y1="236" x2="852" y2="788" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0051D5"/>
    </linearGradient>
    <linearGradient id="ink" x1="336" y1="480" x2="688" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0040C8"/>
    </linearGradient>
  </defs>

  <!-- Black outer field (iOS-opaque) -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- White space ring between black and blue -->
  <rect x="70" y="70" width="884" height="884" rx="200" fill="#FFFFFF"/>

  <!-- Blue meandering ribbon with thick vertical terminations -->
  <path d="M188 340 C 296 236 408 332 512 292 C 616 252 728 240 836 340 C 852 456 852 568 836 684 C 728 788 616 692 512 732 C 408 772 296 788 188 684 C 172 568 172 456 188 340 Z" fill="url(#blue)"/>

  <!-- Scanner device body with visible structure -->
  <rect x="296" y="336" width="432" height="352" rx="32" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="6"/>
  
  <!-- Scanner glass surface (larger, more prominent) -->
  <rect x="316" y="376" width="392" height="240" rx="16" fill="#F2F2F7" stroke="#D1D1D6" stroke-width="4"/>
  
  <!-- Scanner control panel at bottom -->
  <rect x="316" y="640" width="392" height="32" rx="8" fill="#E8E8ED"/>
  
  <!-- Control buttons -->
  <circle cx="360" cy="656" r="8" fill="#007AFF"/>
  <circle cx="400" cy="656" r="8" fill="#34C759"/>
  <circle cx="440" cy="656" r="8" fill="#FF9500"/>

  <!-- SIGN + OCR - Bold, thick, visible at small sizes -->
  <text x="512" y="520" 
        font-family="'Snell Roundhand', 'Brush Script MT', 'Apple Chancery', 'Segoe Script', cursive" 
        font-size="76" 
        font-weight="900" 
        fill="url(#ink)" 
        stroke="url(#ink)"
        stroke-width="3"
        stroke-linejoin="round"
        text-anchor="middle" 
        letter-spacing="2">Sign + OCR</text>
</svg>

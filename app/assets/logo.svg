<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- iOS Superellipse Mask -->
  <defs>
    <clipPath id="squircle">
      <path d="M 512 0 C 760 0 860 0 1024 164 C 1024 328 1024 428 1024 512 C 1024 596 1024 696 860 860 C 696 1024 596 1024 512 1024 C 428 1024 328 1024 164 860 C 0 696 0 596 0 512 C 0 428 0 328 164 164 C 328 0 428 0 512 0 Z"/>
    </clipPath>

    <!-- iOS Blue Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0051D5"/>
    </linearGradient>

    <!-- Document Fold Shadow -->
    <linearGradient id="foldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F2F7"/>
      <stop offset="100%" stop-color="#D1D1D6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGradient)"/>

    <!-- Subtle inner glow (iOS depth) -->
    <rect x="0" y="0" width="1024" height="1024" fill="white" opacity="0.03"/>
  </g>

  <!-- Document Sheet (White) -->
  <g transform="translate(232, 192)">
    <!-- Main body -->
    <rect x="0" y="0" width="560" height="640" rx="48" fill="#FFFFFF"/>
    <!-- Folded corner -->
    <path d="M 480 0 L 560 80 L 480 80 C 468 80 460 72 460 60 L 460 0 Z" fill="url(#foldGradient)"/>

    <!-- Scan Lines (OCR) -->
    <rect x="64" y="180" width="432" height="32" rx="16" fill="#007AFF" opacity="0.15"/>
    <rect x="64" y="240" width="432" height="32" rx="16" fill="#007AFF" opacity="0.15"/>
    <rect x="64" y="300" width="300" height="32" rx="16" fill="#007AFF" opacity="0.15"/>

    <!-- Accent sweep (scanning in action) -->
    <rect x="0" y="420" width="560" height="12" fill="#0051D5" opacity="0.8"/>
  </g>

  <!-- Stylized "K" Mark (White) -->
  <g transform="translate(256, 256)">
    <!-- Vertical stroke -->
    <rect x="0" y="0" width="72" height="512" rx="16" fill="#FFFFFF"/>
    <!-- Top diagonal -->
    <path d="M 72 0 L 72 96 L 320 512 L 248 512 L 72 96 Z" fill="#FFFFFF"/>
    <!-- Bottom diagonal -->
    <path d="M 72 0 L 72 96 L 320 512 L 248 512 L 72 96 Z" fill="#FFFFFF"/>
  </g>
</svg>
